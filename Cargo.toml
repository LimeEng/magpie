[package]
name = "magpie"
version = "0.12.0"
edition = "2024"
description = "High-performance Othello library built with bitboards"
repository = "https://github.com/LimeEng/magpie/"
license = "MIT"
keywords = ["othello", "reversi", "bitboard"]
categories = ["algorithms", "game-engines"]
build = "build/build.rs"

exclude = [".github/**"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
indoc = "2"
paste = "1"
quickcheck = "1"
quickcheck_macros = "1"
rand = "0.10"
serde_json = "1"

[[example]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "serde"
required-features = ["serde"]

[[bench]]
name = "othello_board"
harness = false

[profile.test]
opt-level = 3

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rustdoc]
all = { level = "deny", priority = -1 }
